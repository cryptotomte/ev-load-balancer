name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily: catches breakage from new Home Assistant / test package releases.
    - cron: "13 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    name: Lint + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The Python version decides which Home Assistant gets installed:
        # the newest release that supports that interpreter. Two versions
        # give an older and a current Home Assistant.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # uv.lock is gitignored, so there is nothing to key a cache on.
          enable-cache: false

      - name: Install dependencies
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: Show Python and Home Assistant versions
        run: |
          uv run python --version
          uv pip list | grep -i -E "^homeassistant |^pytest-homeassistant"

      - name: Ruff format check
        run: uv run ruff format --check custom_components/ tests/

      - name: Ruff lint
        run: uv run ruff check custom_components/ tests/

      - name: Pytest
        run: uv run pytest tests/ -v --tb=short
